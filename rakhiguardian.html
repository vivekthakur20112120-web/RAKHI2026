<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, INTIAL-SCALE=1.0">

<title="CATCH RAKHI🎀"TITLE/>
    <link rel="stylesheet" href="rakhiguardian.css">


</head>

<body>

<div class="game-container">

    <h1>🎀 catch rakhi</h1>

    <p class="subtitle">
        Protect the Sacred Bond ❤️
    </p>

    <!-- Top Bar -->

    <div class="top-bar">

        <div class="box">
            ❤️ Love
            <span id="score">0</span>
        </div>

        <div class="box">
            ⭐ High Score
            <span id="highscore">0</span>
        </div>

        <div class="box">
            ⏳ Time
            <span id="timer">30</span>
        </div>

    </div>

    <!-- Mission -->

    <div class="mission">

        🎯 Mission :
        <span id="missionText">
            Catch 10Rakhis
        </span>

    </div>

    <!-- Love Meter -->

    <div class="meter-box">

        <div class="meter">

            <div id="loveMeter"></div>

        </div>

    </div>

    <!-- Game Canvas -->

    <canvas
        id="gameCanvas"
        width="300"
        height="600">
    </canvas
    

    </div>

</div>

    <!-- Buttons -->

    <div class="buttons">

        <button id="startBtn">
            ▶ Start Game
        </button>

        <button id="restartBtn">
            🔄 Restart
        </button>

    </div>

    <!-- Mobile Controls -->

    <div class="mobile-controls">

        <button id="leftBtn">
            ⬅
        </button>

        <button id="rightBtn">
            ➡
        </button>

    </div>

    <!-- Controls -->

    <div class="instructions">

        <p>
            💻 Laptop :
            Arrow Keys
        </p>

        <p>
            📱 Mobile :
            Left & Right Buttons
        </p>

        <p>
            🎀 Catch Good Items
            💣 Avoid Bombs
        </p>

    </div>

    <!-- Secret Button (Hidden) -->

    <button
        id="giftBtn"
        style="display:none;">

        🎁 Open My Secret Gift

    </button>

    <br>

    <a href="games.html">

        <button class="backBtn">

            ⬅ Back To Games

        </button>

    </a>

</div>

<script src="rakhiguardian.js"></script>

</body>
</html>
