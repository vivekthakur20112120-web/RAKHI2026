<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rakhi Admin Panel</title>

    <link rel="stylesheet" href="admin.css">

    <script defer src="admin.js"></script>

</head>

<body>
    <div id="loginBox">

<h2>🔐 Admin Login</h2>

<input id="password" type="password" placeholder="Enter Password">

<button onclick="checkLogin()">
Login
</button>

</div>

<!-- ==========================
        SIDEBAR
=========================== -->

<div class="sidebar">

    <h1>🎀 Admin</h1>

    <button id="dashboardBtn">🏠 Dashboard</button>

    <button id="feedbackBtn">💌 Feedback</button>

    <button id="visitorBtn">👥 Visitors</button>

    <button id="logoutBtn">🚪 Logout</button>

</div>

<!-- ==========================
        MAIN
=========================== -->

<div class="main">

    <h1>

        🎀 Raksha Bandhan Admin Panel

    </h1>

    <!-- =====================
            CARDS
    ====================== -->

    <div class="cards">

        <div class="card">

            <h2>Total Visitors</h2>

            <h1 id="visitorCount">0</h1>

        </div>

        <div class="card">

            <h2>Total Feedback</h2>

            <h1 id="feedbackCount">0</h1>

        </div>

        <div class="card">

            <h2>Average Rating</h2>

            <h1 id="ratingAverage">0⭐</h1>

        </div>

    </div>

    <!-- =====================
            SEARCH
    ====================== -->

    <input

        type="text"

        id="searchBox"

        placeholder="🔍 Search by Name...">

    <!-- =====================
        FEEDBACK LIST
    ====================== -->

    <div id="feedbackContainer">

    </div>

</div>

</body>

</html>
